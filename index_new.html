<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Divya Studio - Order System</title>
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .card { max-width: 450px; margin: 30px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a1a1a; margin-top: 0; }
        label { font-weight: 600; display: block; margin-top: 12px; color: #444; }
        input, button { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { background-color: #25D366; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 18px; transition: 0.3s; }
        button:hover { background-color: #128C7E; }
        .hidden { display: none; }
        .msg { margin-top: 12px; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 14px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="card">
    <h2>Artist Divya Studio</h2>
    <div id="statusMsg" class="msg hidden"></div>

    <!-- Step 1: Mobile & WhatsApp OTP Section -->
    <div id="otpSection">
        <label>Mobile Number (WhatsApp Enabled)</label>
        <input type="tel" id="mobileNo" placeholder="10 Digit Mobile Number" maxlength="10">
        <button id="sendOtpBtn" onclick="requestOTP()">Get WhatsApp OTP</button>

        <div id="verifyOtpBox" class="hidden">
            <label>Enter 6-Digit OTP</label>
            <input type="text" id="otpInput" maxlength="6" placeholder="123456">
            <button onclick="verifyOTP()">Verify OTP</button>
        </div>
    </div>

    <!-- Step 2: Order Booking Form (Shown after OTP verification) -->
    <div id="orderSection" class="hidden">
        <h3>Order Form</h3>
        <label>Customer Name</label>
        <input type="text" id="custName" placeholder="Full Name">

        <label>Service Name</label>
        <input type="text" id="serviceName" placeholder="e.g. Portrait Sketch">

        <label>Variant / Size</label>
        <input type="text" id="variant" placeholder="e.g. A3 Size">

        <label>Address</label>
        <input type="text" id="address" placeholder="Complete Address">

        <label>Pincode</label>
        <input type="text" id="pincode" placeholder="Pincode">

        <label>Total Amount (₹)</label>
        <input type="number" id="totalAmt" placeholder="1000" oninput="calculateBalance()">

        <label>Token Paid (₹)</label>
        <input type="number" id="tokenPaid" placeholder="200" oninput="calculateBalance()">

        <label>Balance Due (₹)</label>
        <input type="number" id="balanceDue" readonly placeholder="0">

        <button onclick="submitOrder()">Submit Order</button>
    </div>
</div>

<script>
    // Supabase Configuration
    const SUPABASE_URL = "https://mqeqpootefowpmpingua.supabase.co";
    const SUPABASE_KEY = "sb_publishable_vwnA4_9z2dV3p0mavP1ARg_UB889s6Z";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Live Render WhatsApp OTP Server API Endpoint
    const OTP_SERVER_URL = "https://whatsapp-otp-serverw.onrender.com/send-otp";

    let generatedOTP = null;

    function showMsg(text, isSuccess) {
        const msgDiv = document.getElementById("statusMsg");
        msgDiv.className = `msg ${isSuccess ? 'success' : 'error'}`;
        msgDiv.innerText = text;
        msgDiv.classList.remove("hidden");
    }

    async function requestOTP() {
        const phone = document.getElementById("mobileNo").value.trim();
        if (phone.length !== 10) {
            showMsg("Kripya sahi 10-digit mobile number daalein!", false);
            return;
        }

        // Generate Random 6-Digit OTP
        generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

        showMsg("WhatsApp par OTP bheja ja raha hai...", true);
        document.getElementById("sendOtpBtn").disabled = true;

        try {
            let res = await fetch(`${OTP_SERVER_URL}?phone=91${phone}&otp=${generatedOTP}`);
            let data = await res.json();

            if (data.success) {
                showMsg("OTP aapke WhatsApp par bhej diya gaya hai!", true);
                document.getElementById("verifyOtpBox").classList.remove("hidden");
            } else {
                showMsg("OTP Error: " + data.error, false);
                document.getElementById("sendOtpBtn").disabled = false;
            }
        } catch (err) {
            showMsg("Server Error: " + err.message, false);
            document.getElementById("sendOtpBtn").disabled = false;
        }
    }

    function verifyOTP() {
        const userOTP = document.getElementById("otpInput").value.trim();
        if (userOTP === generatedOTP) {
            showMsg("Phone Number Verified Successfully!", true);
            document.getElementById("otpSection").classList.add("hidden");
            document.getElementById("orderSection").classList.remove("hidden");
        } else {
            showMsg("Galat OTP! Kripya sahi OTP daalein.", false);
        }
    }

    function calculateBalance() {
        const total = parseFloat(document.getElementById("totalAmt").value) || 0;
        const token = parseFloat(document.getElementById("tokenPaid").value) || 0;
        document.getElementById("balanceDue").value = total - token;
    }

    async function submitOrder() {
        const phone = document.getElementById("mobileNo").value;
        const name = document.getElementById("custName").value;
        const service = document.getElementById("serviceName").value;
        const variant = document.getElementById("variant").value;
        const address = document.getElementById("address").value;
        const pincode = document.getElementById("pincode").value;
        const total = parseFloat(document.getElementById("totalAmt").value) || 0;
        const token = parseFloat(document.getElementById("tokenPaid").value) || 0;
        const balance = total - token;

        if (!name || !service) {
            showMsg("Kripya Naam aur Service details bharein!", false);
            return;
        }

        showMsg("Order Save ho raha hai...", true);

        // Direct Save to Supabase 'orders' Table
        const { data, error } = await supabase
            .from('orders')
            .insert([
                {
                    customer_name: name,
                    phone: phone,
                    service: service,
                    variant: variant,
                    address: address,
                    pincode: pincode,
                    total_amount: total,
                    token_paid: token,
                    balance_due: balance,
                    status: 'Active'
                }
            ]);

        if (error) {
            showMsg("Order Save Error: " + error.message, false);
        } else {
            showMsg("Order Supabase Database mein successfully save ho gaya! 🎉", true);
            document.getElementById("orderSection").classList.add("hidden");
        }
    }
</script>
</body>
</html>
